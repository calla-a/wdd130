<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>Form</h1>
    </header>

    <form action="">
        <fieldset>
            <legend>Contact Information</legend>
            <div class="form-item label-narrow">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>

            <div class="form-item label-narrow">
                <label for="email">Email Address:</label>
                <input type="email" id="usermail" name="usermail" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <div class="form-item label-wide">
                <label for="browser">What is your favorite internet browser?</label>
                <select name="browser" id="browser">
                    <option value="chrome">Chrome</option>
                    <option value="edge">Edge</option>
                    <option value="safari">Safari</option>
                </select>
            </div>

            <div class="form-item label-wide">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>

            <div class="form-item">
                <label for="places">List the places you have lived:</label>
                <textarea name="places" id="places" rows="4"
                  placeholder="Guatemala, Panajachel, La Ceiba, La Masica"></textarea>
            </div>
        </fieldset>
        <button type="submit">Submit Poll</button>
    </form>
</body>

</html>
